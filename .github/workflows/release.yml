name: Release

# Push a tag like v0.3.0 to build installers for every platform and publish a
# GitHub release. The release includes signed update bundles and latest.json,
# which installed apps poll to update themselves.
#
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (the updater signing key).
# Optional: TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS (needs Apple signing secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04          # AppImage, .deb, .rpm
            args: ""
          - platform: windows-latest        # .exe (NSIS), .msi
            args: ""
          - platform: macos-latest          # Apple Silicon .dmg
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest          # Intel .dmg
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-build{0}', github.run_number) }}
          releaseName: "WillaAI v__VERSION__"
          releaseBody: "Download the installer for your system below. Installed copies of WillaAI update themselves."
          # Tag builds are published as the latest release so the in-app updater sees them.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The action's default package list includes "tools", which Google removed
      # from the SDK repository, so name the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.0.12077973"
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          [ -d src-tauri/gen/android ] || pnpm tauri android init --ci
          pnpm tauri android build --apk --ci
      # Unsigned release APK. Add a keystore (see README) to get an installable signed build.
      - uses: actions/upload-artifact@v4
        with:
          name: willa-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      - run: pnpm install --frozen-lockfile
      - name: Build IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          [ -d src-tauri/gen/apple ] || pnpm tauri ios init --ci
          pnpm tauri ios build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: willa-ios
          path: src-tauri/gen/apple/build/**/*.ipa
